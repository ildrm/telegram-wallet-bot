services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telegram_wallet
      MYSQL_USER: wallet_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a database application password in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate migration/backup password in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=TCP -h 127.0.0.1 -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app: &app
    build: .
    image: telegram-wallet-sandbox:local
    environment: &app-environment
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Generate APP_KEY using php artisan key:generate}
      APP_URL: ${APP_URL:-https://bot-backend.example.invalid}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: telegram_wallet
      DB_USERNAME: wallet_app
      DB_PASSWORD: ${DB_PASSWORD:?Set a database application password in .env}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      WALLET_LIVE_ENABLED: 'false'
      CUSTODY_DRIVER: fake
      CUSTODY_WEBHOOK_SECRET: ${CUSTODY_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ADMIN_ROLES: ${TELEGRAM_ADMIN_ROLES:?Set a JSON roles map or an empty object in .env}
      OWNER_PAYOUT_ADDRESS: ${OWNER_PAYOUT_ADDRESS:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-environment
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate migration/backup password in .env}
    command: [php, artisan, migrate, '--force']
    restart: 'no'
  queue:
    <<: *app
    command: [php, artisan, 'queue:work', '--sleep=1', '--tries=5', '--timeout=45', '--max-time=3600']
  scheduler:
    <<: *app
    command: [php, artisan, 'schedule:work']
  nginx:
    image: nginx:stable-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [app]
    restart: unless-stopped
volumes:
  mysql-data:
